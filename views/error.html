{{> header}}

<main class="container my-5 py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-danger text-center p-4">
                <div class="card-body">
                    <h2 class="card-title text-danger mb-3">Error</h2>
                    <p class="card-text lead mb-4">{{errorMessage}}</p>
                    <a href="{{backUrl}}" class="btn btn-danger">{{backText}}</a>
                </div>
            </div>
        </div>
    </div>
</main>

{{> footer}}
