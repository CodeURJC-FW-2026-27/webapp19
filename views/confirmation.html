<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>DreamHouse | Confirmation</title>
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="/css/styles.css" rel="stylesheet" />
    <!-- Custom project CSS-->
    <link href="/css/custom.css" rel="stylesheet" />
</head>

<body>
    {{> header}}

    <main class="container my-5 py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-success text-center p-4">
                    <div class="card-body">
                        <h2 class="card-title text-success mb-3">{{title}}</h2>
                        <p class="card-text lead mb-4">{{message}}</p>
                        <a href="{{backUrl}}" class="btn btn-success">{{backText}}</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    {{> footer}}
</body>

</html>
