<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>DreamHouse | Edit Review</title>
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="/css/styles.css" rel="stylesheet" />
    <!-- Custom project CSS-->
    <link href="/css/custom.css" rel="stylesheet" />
</head>

<body>
    {{> header}}
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <div class="card shadow-sm">
                    <div class="card-body p-3 p-md-5">
                        <h1 class="h3 mb-4">Edit Review</h1>
                        <form action="/property/{{property._id}}/review/{{review._id}}/edit" method="POST">
                            <div class="mb-3">
                                <label for="reviewAuthor" class="form-label">Your Name</label>
                                <input type="text" class="form-control" id="reviewAuthor" name="author" minlength="2" maxlength="50"
                                    value="{{review.author}}" required />
                            </div>
                            <div class="mb-3">
                                <label for="reviewDate" class="form-label">Date</label>
                                <input type="date" class="form-control" id="reviewDate" name="date"
                                    value="{{review.date}}" required />
                            </div>
                            <div class="mb-3">
                                <label for="reviewRating" class="form-label">Rating</label>
                                <select class="form-select" id="reviewRating" name="rating" required>
                                    {{#ratings}}
                                    <option value="{{value}}" {{#selected}}selected{{/selected}}>{{label}}</option>
                                    {{/ratings}}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="reviewComment" class="form-label">Comment</label>
                                <textarea class="form-control" id="reviewComment" name="comment" rows="4"
                                    minlength="5" maxlength="500" required>{{review.comment}}</textarea>
                            </div>
                            <div class="d-flex justify-content-end gap-2">
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                                <a class="btn btn-outline-dark" href="/property/{{property._id}}">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    {{> footer}}
</body>

</html>
