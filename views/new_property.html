<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Create or edit a property listing in DreamHouse." />
    <title>DreamHouse | {{pageTitle}}</title>
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="/css/styles.css" rel="stylesheet" />
    <!-- Custom project CSS-->
    <link href="/css/custom.css" rel="stylesheet" />
</head>

<body>
    {{> header}}
    <!-- Property form-->
    <main>
        <section class="py-3">
            <div class="container px-4 px-lg-5">
                <div class="row justify-content-center">
                    <div class="col-lg-8 col-xl-7">
                        <div class="card shadow-sm">
                            <div class="card-body p-3 p-md-5">
                                <h1 class="h3 mb-4">{{pageTitle}}</h1>
                                <form action="{{formAction}}" method="POST" enctype="multipart/form-data">
                                    <div class="mb-3">
                                        <label for="propertyTitle" class="form-label">Address</label>
                                        <input type="text" class="form-control" id="propertyTitle" name="title"
                                            value="{{property.title}}" pattern="[A-ZÁÉÍÓÚÜÑ].*"
                                            title="Start with an uppercase letter." placeholder="e.g. C. Gran Vía 1"
                                            required />
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="propertyCategory" class="form-label">Category</label>
                                            <select class="form-select" id="propertyCategory" name="category" required>
                                                <option value="" disabled {{^isEdit}}selected{{/isEdit}}>Select category...</option>
                                                <option value="Shared Apartment" {{#isSharedApartment}}selected{{/isSharedApartment}}>Shared Apartment</option>
                                                <option value="Full House" {{#isFullHouse}}selected{{/isFullHouse}}>Full House</option>
                                                <option value="Room" {{#isRoom}}selected{{/isRoom}}>Room</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="propertyStatus" class="form-label">Status</label>
                                            <select class="form-select" id="propertyStatus" name="status" required>
                                                <option value="Available" {{#isAvailable}}selected{{/isAvailable}}>Available</option>
                                                <option value="Rented" {{#isRented}}selected{{/isRented}}>Rented</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="propertyPrice" class="form-label">Monthly price (€)</label>
                                        <input type="number" class="form-control" id="propertyPrice" name="price"
                                            value="{{property.price}}" min="1" max="50000" step="0.01"
                                            placeholder="e.g. 850" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="propertyLocation" class="form-label">Location</label>
                                        <input type="text" class="form-control" id="propertyLocation" name="location"
                                            value="{{property.location}}" placeholder="City or neighbourhood" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="propertyDescription" class="form-label">Description</label>
                                        <textarea class="form-control" id="propertyDescription" name="description" rows="5"
                                            placeholder="Describe the property and its features" minlength="20" maxlength="1000"
                                            required>{{property.description}}</textarea>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="propertyBedrooms" class="form-label">Bedrooms</label>
                                            <input type="number" class="form-control" id="propertyBedrooms"
                                                name="bedrooms" value="{{property.bedrooms}}" min="0" max="20"
                                                step="1" placeholder="e.g. 2" required />
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="propertyArea" class="form-label">Area (m²)</label>
                                            <input type="number" class="form-control" id="propertyArea" name="area"
                                                value="{{property.area}}" min="1" max="5000" step="0.01"
                                                placeholder="e.g. 75" required />
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label for="propertyImage" class="form-label">Property image</label>
                                        <input type="file" class="form-control" id="propertyImage" name="image"
                                            accept="image/*" aria-describedby="propertyImageHelp"
                                            {{^isEdit}}required{{/isEdit}} />
                                        {{#isEdit}}
                                        <img src="/uploads/{{property.image}}" class="img-thumbnail mt-2"
                                            alt="Current image for {{property.title}}" style="max-width: 200px;" />
                                        {{/isEdit}}
                                        <div id="propertyImageHelp" class="form-text">Select an image file for this
                                            property.</div>
                                    </div>
                                    <div class="d-flex flex-column flex-sm-row justify-content-end gap-2">
                                        <button type="submit" class="btn btn-primary">{{submitText}}</button>
                                        <a class="btn btn-outline-dark" href="{{cancelUrl}}">Cancel</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    {{> footer}}
</body>

</html>
