<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Add a new property listing to DreamHouse." />
    <title>DreamHouse | Add Property</title>
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <!-- Custom project CSS-->
    <link href="css/custom.css" rel="stylesheet" />
</head>

<body>
    {{header}}
    <!-- Property form-->
    <main>
        <section class="py-3">
            <div class="container px-4 px-lg-5">
                <div class="row justify-content-center">
                    <div class="col-lg-8 col-xl-7">
                        <div class="card shadow-sm">
                            <div class="card-body p-3 p-md-5">
                                <form>
                                    <div class="mb-3">
                                        <label for="propertyTitle" class="form-label">Address</label>
                                        <input type="text" class="form-control" id="propertyTitle" name="title"
                                            placeholder="e.g. C. Gran Vía 1" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="propertyCategory" class="form-label">Category</label>
                                        <select class="form-select" id="propertyCategory" name="category" required>
                                            <option value="" selected disabled> Select category...</option>
                                            <option value="shared"> Shared Apartments</option>
                                            <option value="house">Full Houses</option>
                                            <option value="room">Rooms</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="propertyPrice" class="form-label">Monthly price (€)</label>
                                        <input type="number" class="form-control" id="propertyPrice" name="price"
                                            min="1" step="0.01" placeholder="e.g. 850" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="propertyLocation" class="form-label">Location</label>
                                        <input type="text" class="form-control" id="propertyLocation" name="location"
                                            placeholder="City or neighbourhood" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="propertyDescription" class="form-label">Description</label>
                                        <textarea class="form-control" id="propertyDescription" name="description"
                                            rows="5" placeholder="Describe the property and its features" minlength="20"
                                            maxlength="1000" required></textarea>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="propertyRooms" class="form-label">Bedrooms</label>
                                            <input type="number" class="form-control" id="propertyRooms" name="rooms"
                                                min="0" step="1" placeholder="e.g. 2" required />
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="propertyArea" class="form-label">Area (m²)</label>
                                            <input type="number" class="form-control" id="propertyArea" name="area"
                                                min="1" step="0.01" placeholder="e.g. 75" required />
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label for="propertyImage" class="form-label">Property image</label>
                                        <input type="file" class="form-control" id="propertyImage" name="image"
                                            accept="image/*" aria-describedby="propertyImageHelp" required />
                                        <div id="propertyImageHelp" class="form-text">Select an image file for this
                                            property.</div>
                                    </div>
                                    <div class="d-flex flex-column flex-sm-row justify-content-end gap-2">
                                        <button type="button" class="btn btn-primary">Save</button>
                                        <a class="btn btn-outline-dark" href="index.html">Cancel</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- Footer-->
    <footer class="py-5 bg-dark">
        <div class="container">
            <p class="m-0 text-center text-white">Copyright &copy; DreamHouse 2026</p>
        </div>
    </footer>
    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>
</body>

</html>
